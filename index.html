<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Hey Cutie ❤️</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:Arial,sans-serif;background:#fff0f6}
.page{
 width:100%;height:100dvh;position:relative;overflow:hidden;text-align:center;
 background:radial-gradient(circle at 50% 18%,#fff,#ffe9f1 45%,#ffd0df 100%);
}
.top{position:absolute;z-index:8;top:5%;left:0;right:0}
.top h1{
 margin:0;color:#e34b73;font:900 clamp(30px,8vw,46px) "Comic Sans MS",cursive;
 text-shadow:0 2px #fff;
}
.top p{margin:5px 0;color:#9a4965;font-size:14px}
.tap{
 position:absolute;z-index:8;top:16%;left:50%;transform:translateX(-50%);
 border:0;border-radius:999px;padding:12px 22px;background:#fff;
 color:#e34b73;font:bold 18px "Comic Sans MS",cursive;
 box-shadow:0 7px 22px #8f315033;animation:pulse 1.2s infinite;cursor:pointer;
}
.character{
 position:absolute;z-index:4;left:50%;top:51%;width:min(88vw,500px);
 transform:translate(-50%,-50%);cursor:pointer;
 transition:filter .3s;
}
.character img{display:block;width:100%;height:auto;border-radius:28px}
.dance{animation:dance .38s infinite alternate}
.eyeCover{
 position:absolute;z-index:7;width:13%;height:6%;
 background:#ffd8c1;border-radius:50%;opacity:0;
 transform:scaleY(.15);transform-origin:center;
}
.leftEye{left:31%;top:37.5%}
.rightEye{left:54%;top:31.7%}
.blink .eyeCover{opacity:1;animation:blink .18s ease-in-out}
.closedLine{
 position:absolute;z-index:8;width:10%;height:2px;background:#6b403b;border-radius:50%;
 opacity:0;
}
.blink .closedLine{opacity:1;animation:closed .18s ease-in-out}
.leftLine{left:32%;top:40.3%;transform:rotate(8deg)}
.rightLine{left:55%;top:34.4%;transform:rotate(-8deg)}
.message{
 display:none;position:absolute;z-index:12;left:50%;bottom:5%;transform:translateX(-50%);
 width:min(91%,470px);padding:20px 18px;background:rgba(255,250,252,.98);
 border:3px solid #ff91b1;border-radius:25px;box-shadow:0 15px 40px #7d1d472e;
}
.message h2{margin:0 0 8px;color:#e04370;font:900 31px "Comic Sans MS",cursive}
.message p{margin:8px 0;color:#633447;font-size:17px;line-height:1.45}
.special{font-weight:700;color:#9e3156!important}
.flower,.heart,.kiss{position:absolute;z-index:10;pointer-events:none}
.flower{top:-45px;animation:fall linear forwards}
.heart{font-size:28px;animation:float 1.8s ease-out forwards}
.kiss{font-size:52px;animation:kiss 1.4s forwards}
@keyframes pulse{50%{transform:translateX(-50%) scale(1.08)}}
@keyframes dance{
 from{transform:translate(-50%,-50%) rotate(-2deg) translateY(0)}
 to{transform:translate(-50%,-50%) rotate(2deg) translateY(-8px)}
}
@keyframes fall{to{transform:translateY(115vh) rotate(540deg);opacity:.7}}
@keyframes float{
 0%{opacity:0;transform:translate(-50%,0) scale(.2)}
 20%{opacity:1}
 100%{opacity:0;transform:translate(calc(-50% + 100px),-180px) scale(1.5)}
}
@keyframes kiss{
 0%{opacity:0;transform:translate(0,0) scale(.2)}
 20%{opacity:1}
 100%{opacity:0;transform:translate(130px,-130px) scale(1.5)}
}
@keyframes blink{
 0%{transform:scaleY(.15);opacity:0}
 35%{transform:scaleY(1);opacity:1}
 70%{transform:scaleY(1);opacity:1}
 100%{transform:scaleY(.15);opacity:0}
}
@keyframes closed{
 0%{opacity:0;transform:scaleX(.4) rotate(8deg)}
 40%{opacity:1;transform:scaleX(1) rotate(8deg)}
 100%{opacity:0;transform:scaleX(.4) rotate(8deg)}
}
</style>
</head>
<body>
<div class="page" id="page">
 <div class="top">
   <h1>Click me cutie ❤️</h1>
   <p>Someone has a tiny message for you...</p>
 </div>

<script>
const page=document.getElementById('page');
const character=document.getElementById('character');
const tap=document.getElementById('tap');
const message=document.getElementById('message');

function blink(){
 character.classList.remove('blink');
 void character.offsetWidth;
 character.classList.add('blink');
 setTimeout(()=>character.classList.remove('blink'),220);
}
function autoBlink(){
 const delay=2200+Math.random()*2200;
 setTimeout(()=>{blink();autoBlink()},delay);
}
function flowers(){
 const a=['🌸','🌷','🌹','✨','💕','💖'];
 for(let i=0;i<42;i++)setTimeout(()=>{
  const e=document.createElement('div');e.className='flower';
  e.textContent=a[Math.floor(Math.random()*a.length)];
  e.style.left=Math.random()*100+'%';
  e.style.fontSize=(18+Math.random()*25)+'px';
  e.style.animationDuration=(3+Math.random()*3)+'s';
  page.appendChild(e);setTimeout(()=>e.remove(),7000);
 },i*65);
}
function hearts(){
 for(let i=0;i<18;i++)setTimeout(()=>{
  const e=document.createElement('div');e.className='heart';
  e.textContent=['❤️','💗','💖','💕'][Math.floor(Math.random()*4)];
  e.style.left=(42+Math.random()*16)+'%';e.style.top='48%';
  page.appendChild(e);setTimeout(()=>e.remove(),2000);
 },i*110);
}
function kiss(){
 const e=document.createElement('div');e.className='kiss';e.textContent='💋';
 e.style.left='48%';e.style.top='42%';page.appendChild(e);
 setTimeout(()=>e.remove(),1500);
}
function start(){
 tap.style.display='none';
 blink();kiss();flowers();hearts();
 character.classList.add('dance');
 setTimeout(()=>{
   character.classList.remove('dance');
   message.style.display='block';
 },1500);
}
tap.addEventListener('click',start);
character.addEventListener('click',start);
autoBlink();
</script>
