<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Hey Cutie ❤️</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:Arial,sans-serif;background:#ffb4cd}
.page{
  width:100%;height:100dvh;position:relative;overflow:hidden;text-align:center;
  background:
    radial-gradient(circle at 20% 20%,#fff 0 3px,transparent 4px),
    radial-gradient(circle at 80% 30%,#fff 0 3px,transparent 4px),
    linear-gradient(145deg,#ffeaf2,#ffc2d7 55%,#f79ab8);
}
.glow{
  position:absolute;width:280px;height:280px;border-radius:50%;
  background:rgba(255,255,255,.25);left:50%;top:40%;
  transform:translate(-50%,-50%);filter:blur(12px);
}
.heading{
  position:absolute;top:7%;left:0;right:0;z-index:4;
  color:#a52558;font:900 clamp(28px,8vw,42px) "Comic Sans MS",cursive;
  text-shadow:0 2px #fff;
}
.tap{
  position:absolute;z-index:6;top:17%;left:50%;transform:translateX(-50%);
  padding:12px 20px;border:3px solid #ff6e9c;border-radius:30px;
  background:#fff;color:#b4215a;font:bold 17px "Comic Sans MS",cursive;
  box-shadow:0 7px 20px rgba(130,20,70,.18);
  animation:pulse 1.2s infinite;
}
.boy{
  position:absolute;z-index:3;left:50%;top:52%;
  width:190px;height:310px;transform:translate(-50%,-50%);
  transform-origin:center bottom;cursor:pointer;
}
.hair{
  position:absolute;left:35px;top:0;width:120px;height:78px;background:#251d27;
  border-radius:55% 55% 38% 45%;z-index:4;
}
.hair:before,.hair:after{
  content:"";position:absolute;background:#251d27;border-radius:50%;
}
.hair:before{width:48px;height:45px;left:-8px;top:30px;transform:rotate(20deg)}
.hair:after{width:45px;height:42px;right:-8px;top:28px;transform:rotate(-20deg)}
.face{
  position:absolute;left:39px;top:44px;width:112px;height:105px;
  background:#ffd7bb;border:3px solid #9d554a;border-radius:48%;
}
.ear{position:absolute;top:78px;width:24px;height:30px;background:#ffd7bb;border:3px solid #9d554a;border-radius:50%}
.ear.l{left:22px}.ear.r{right:22px}
.eye{position:absolute;top:84px;width:12px;height:18px;background:#231a23;border-radius:50%;z-index:5}
.eye.l{left:69px}.eye.r{right:69px}
.cheek{position:absolute;top:108px;width:24px;height:10px;background:#f28ca0;border-radius:50%;z-index:5;opacity:.75}
.cheek.l{left:47px}.cheek.r{right:47px}
.mouth{position:absolute;top:115px;left:78px;width:30px;height:16px;border-bottom:4px solid #923c53;border-radius:50%;z-index:5}
.neck{position:absolute;left:83px;top:143px;width:25px;height:20px;background:#ffd7bb;border:3px solid #9d554a}
.shirt{
  position:absolute;left:40px;top:153px;width:110px;height:91px;
  background:#68a8e8;border:3px solid #3972aa;border-radius:25px 25px 16px 16px;z-index:2;
}
.shirt:after{
  content:"♥";position:absolute;left:43px;top:20px;color:#fff;font-size:27px;
}
.arm{
  position:absolute;top:160px;width:28px;height:83px;background:#ffd7bb;
  border:3px solid #9d554a;border-radius:18px;z-index:1;
}
.arm.l{left:22px;transform:rotate(25deg)}.arm.r{right:22px;transform:rotate(-25deg)}
.short{
  position:absolute;left:40px;top:232px;width:110px;height:47px;
  background:#f08a58;border:3px solid #a94f32;border-radius:10px 10px 22px 22px;z-index:2;
}
.leg{position:absolute;top:268px;width:27px;height:32px;background:#ffd7bb;border:3px solid #9d554a;z-index:1}
.leg.l{left:61px}.leg.r{right:61px}
.shoe{position:absolute;top:292px;width:47px;height:18px;background:#332538;border-radius:50%}
.shoe.l{left:35px}.shoe.r{right:35px}
.heart{
  position:absolute;z-index:7;font-size:28px;pointer-events:none;
  animation:float 2s ease-out forwards;
}
.flower{
  position:absolute;top:-40px;z-index:6;pointer-events:none;
  animation:fall linear forwards;
}
.message{
  display:none;position:absolute;z-index:10;left:50%;top:50%;
  transform:translate(-50%,-50%);width:min(90%,450px);
  background:rgba(255,250,252,.98);border:3px solid #ff78a5;
  border-radius:28px;padding:25px 20px;
  box-shadow:0 15px 45px rgba(90,15,55,.28);
}
.message h2{
  margin:0 0 12px;color:#d32669;
  font:900 clamp(27px,8vw,39px) "Comic Sans MS",cursive;
}
.message p{font-size:18px;line-height:1.55;color:#6d2948;margin:10px 0}
.message .special{font-weight:800;color:#a51e55}
.kiss{position:absolute;z-index:9;font-size:52px;animation:kiss 1.5s forwards}
.dance{animation:dance .38s infinite alternate}
@keyframes dance{
  from{transform:translate(-50%,-50%) rotate(-8deg) translateY(0)}
  to{transform:translate(-50%,-50%) rotate(8deg) translateY(-13px)}
}
@keyframes pulse{50%{transform:translateX(-50%) scale(1.07)}}
@keyframes float{
  0%{opacity:0;transform:translate(-50%,0) scale(.3)}
  20%{opacity:1}
  100%{opacity:0;transform:translate(calc(-50% + 100px),-180px) scale(1.5)}
}
@keyframes fall{
  to{transform:translateY(115vh) rotate(520deg);opacity:.85}
}
@keyframes kiss{
  0%{opacity:0;transform:scale(.3)}
  20%{opacity:1}
  100%{opacity:0;transform:translate(145px,-130px) scale(1.5)}
}
</style>
</head>
<body>
<div class="page" id="page">
  <div class="glow"></div>
  <div class="heading">A tiny surprise for you ❤️</div>

  <div class="tap" id="tap">💗 Tap on me, cutie 💗</div>

  <div class="boy" id="boy" aria-label="cute dancing boy">
    <div class="hair"></div>
    <div class="ear l"></div><div class="ear r"></div>
    <div class="face"></div>
    <div class="eye l"></div><div class="eye r"></div>
    <div class="cheek l"></div><div class="cheek r"></div>
    <div class="mouth"></div><div class="neck"></div>
    <div class="shirt"></div>
    <div class="arm l"></div><div class="arm r"></div>
    <div class="short"></div>
    <div class="leg l"></div><div class="leg r"></div>
    <div class="shoe l"></div><div class="shoe r"></div>
  </div>

  <div class="message" id="message">
    <h2>Hey cutie ❤️</h2>
    <p>I know you're travelling, so just take care of yourself, okay? 🌸</p>
    <p class="special">And if you need anything at all, let me know… or just give me a call without hesitation. 📞❤️</p>
    <p>I'll be happy to hear from you. 🥺💕</p>
    <div style="font-size:30px">💋🌷❤️✨</div>
  </div>
</div>

<script>
const boy=document.getElementById("boy");
const tap=document.getElementById("tap");
const message=document.getElementById("message");
const page=document.getElementById("page");

function flowers(){
  const symbols=["🌸","🌷","🌹","💗","✨"];
  for(let i=0;i<38;i++){
    setTimeout(()=>{
      const e=document.createElement("div");
      e.className="flower";
      e.textContent=symbols[Math.floor(Math.random()*symbols.length)];
      e.style.left=Math.random()*100+"%";
      e.style.fontSize=(18+Math.random()*24)+"px";
      e.style.animationDuration=(3+Math.random()*3)+"s";
      page.appendChild(e);
      setTimeout(()=>e.remove(),7000);
    },i*75);
  }
}
function hearts(){
  for(let i=0;i<18;i++){
    setTimeout(()=>{
      const e=document.createElement("div");
      e.className="heart";
      e.textContent=["❤️","💗","💖","💕"][Math.floor(Math.random()*4)];
      e.style.left=(42+Math.random()*16)+"%";
      e.style.top="50%";
      page.appendChild(e);
      setTimeout(()=>e.remove(),2100);
    },i*110);
  }
}
function kiss(){
  const e=document.createElement("div");
  e.className="kiss";
  e.textContent="💋";
  e.style.left="50%";e.style.top="43%";
  page.appendChild(e);
  setTimeout(()=>e.remove(),1600);
}
function openSurprise(){
  tap.style.display="none";
  boy.classList.add("dance");
  kiss();
  flowers();
  hearts();
  setTimeout(()=>{
    boy.classList.remove("dance");
    message.style.display="block";
  },1500);
}
tap.addEventListener("click",openSurprise);
boy.addEventListener("click",openSurprise);
</script>
</body>
</html>
